name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: |
          mkdir -p dist
          GOOS=linux  GOARCH=amd64 go build -ldflags="-s -w" -o dist/git-frontend-linux-amd64   ./cmd/git-frontend
          GOOS=linux  GOARCH=arm64 go build -ldflags="-s -w" -o dist/git-frontend-linux-arm64   ./cmd/git-frontend
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/git-frontend-darwin-amd64  ./cmd/git-frontend
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/git-frontend-darwin-arm64  ./cmd/git-frontend

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
